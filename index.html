<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>카드매치 — 내 카드 혜택 찾기</title>
<style>
  :root { --bg:#ffffff; --ink:#1a1d24; --sub:#5c6472; --line:#e5e7eb; --brand:#2563eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1115; --ink:#f0f1f3; --sub:#9aa2ae; --line:#2a2f38; --brand:#6d9bff; }
  }
  body { font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; max-width: 560px; margin: 0 auto; padding: 48px 20px 60px; background: var(--bg); color: var(--ink); line-height: 1.7; word-break: keep-all; }
  h1 { font-size: 26px; font-weight: 800; margin-bottom: 6px; }
  h1 span { color: var(--brand); }
  p.tagline { color: var(--sub); font-size: 15px; margin-bottom: 28px; }
  ul { padding-left: 20px; margin-bottom: 28px; }
  li { margin-bottom: 6px; }
  a.link { color: var(--brand); font-weight: 600; text-underline-offset: 3px; }
  .box { background: color-mix(in srgb, var(--brand) 8%, transparent); border-radius: 12px; padding: 16px 18px; font-size: 13.5px; color: var(--sub); margin-top: 32px; }
</style>
</head>
<body>
  <h1>카드<span>매치</span></h1>
  <p class="tagline">매장을 검색하면, 내 카드 중 혜택 있는 카드를 찾아드려요. 실적 함정 경고까지 챙겨드립니다.</p>
  <ul>
    <li>보유 카드를 등록하면 카테고리·매장별로 어떤 카드가 유리한지 바로 알려드려요</li>
    <li>"전월실적 미충족 시 혜택 제한" 같은 함정을 놓치지 않도록 경고해드려요</li>
    <li>카드번호·거래내역은 수집하지 않고, 등록한 카드 목록은 기기 안에만 저장됩니다</li>
  </ul>
  <p><a class="link" href="privacy.html">개인정보처리방침 →</a></p>
  <div class="box">ⓘ 이 페이지는 카드매치 앱의 공식 안내 페이지입니다. 앱은 카드사와 무관한 정보 안내 서비스로, 결제·금융거래·금융상품 판매를 수행하지 않습니다.</div>
</body>
</html>
